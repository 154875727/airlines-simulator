<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>送机模拟器 · 浦东机场 T2</title>
<style>
:root{--bg:#1b1e24;--panel:#242933;--panel2:#2c323e;--line:#3a4150;--txt:#e9ebf1;--dim:#98a1b3;--acc:#f0b429;--ok:#49b981;--bad:#e05c5c;--info:#5aa9e6;--route:#4fd1e0;--tow:#7ee2a0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--txt);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:14px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto}
header h1{font-size:18px;font-weight:600;letter-spacing:1px}
header h1 span{color:var(--acc)}
.tabs{display:flex;gap:6px;margin-left:18px}
.tab{padding:6px 16px;border-radius:6px;background:var(--panel2);color:var(--dim);cursor:pointer;border:1px solid var(--line);font-size:14px;user-select:none}
.tab.active{background:var(--acc);color:#1b1e24;font-weight:600;border-color:var(--acc)}
.hdr-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{padding:7px 14px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--acc)}
.btn.primary{background:var(--acc);color:#1b1e24;font-weight:600;border-color:var(--acc)}
.btn.ok{background:var(--ok);color:#10231a;font-weight:600;border-color:var(--ok)}
.btn:disabled{opacity:.45;cursor:not-allowed}
main{flex:1;display:flex;min-height:0}
#mapWrap{flex:1;position:relative;background:#22262d;min-width:0}
#map{width:100%;height:100%;display:block;cursor:grab}
#map:active{cursor:grabbing}
#side{flex:0 0 400px;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px}
.card h3{font-size:14px;color:var(--acc);margin-bottom:8px;letter-spacing:1px}
.dim{color:var(--dim);font-size:13px;line-height:1.7}
#standInfo b{color:var(--acc);font-size:16px}
.ruletxt{font-size:13px;line-height:1.8;color:var(--txt);background:#232732;border-radius:6px;padding:8px;margin-top:6px;border-left:3px solid var(--acc)}
#instrInput{width:100%;padding:9px;border-radius:6px;border:1px solid var(--line);background:#1e222a;color:var(--txt);font-size:14px;font-family:inherit}
#instrInput:focus{outline:none;border-color:var(--acc)}
#parseOut{font-size:13px;line-height:1.9;margin-top:8px}
#parseOut .tag{display:inline-block;background:#31405a;color:#9ecbff;border-radius:4px;padding:0 6px;margin-right:6px;font-size:12px}
.dirBtns{display:flex;gap:8px}
.dirBtn{flex:1;padding:10px 0;text-align:center;border-radius:6px;border:1px solid var(--line);background:#1e222a;cursor:pointer;font-size:15px;user-select:none}
.dirBtn:hover{border-color:var(--acc)}
.dirBtn.sel{background:var(--acc);color:#1b1e24;font-weight:700;border-color:var(--acc)}
.mvOpts{display:flex;flex-direction:column;gap:6px}
.mvOpt{padding:8px 10px;border-radius:6px;border:1px solid var(--line);background:#1e222a;cursor:pointer;font-size:14px;user-select:none}
.mvOpt:hover{border-color:var(--acc)}
.mvOpt.sel{background:var(--acc);color:#1b1e24;font-weight:600;border-color:var(--acc)}
#feedback{font-size:14px;line-height:2}
#feedback .good{color:var(--ok)}
#feedback .bad{color:var(--bad)}
#feedback .ansline{background:#232732;border-radius:6px;padding:8px;margin:4px 0}
.stepHint{font-size:13px;color:var(--dim);margin-bottom:6px}
.stepHint b{color:var(--info)}
#caption{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(20,23,28,.88);border:1px solid var(--acc);color:var(--acc);padding:8px 22px;border-radius:20px;font-size:16px;display:none;pointer-events:none;z-index:5}
#mapToolbar{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;z-index:5}
#mapToolbar .btn{width:38px;height:38px;padding:0;font-size:18px;text-align:center}
#legend{position:absolute;left:12px;bottom:12px;background:rgba(20,23,28,.88);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:12px;line-height:1.9;color:var(--dim);z-index:5}
.sw{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
#quizBar{display:none;align-items:center;gap:10px;font-size:14px}
#quizBar .prog{color:var(--acc);font-weight:700}
.modalMask{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;width:460px;max-height:70vh;overflow-y:auto}
.modal h2{font-size:16px;margin-bottom:12px;color:var(--acc)}
.modal .hrow{display:flex;justify-content:space-between;padding:7px 4px;border-bottom:1px dashed var(--line);font-size:13px}
#errbox{position:fixed;left:10px;top:10px;background:#5a1d1d;color:#ffd7d7;padding:10px 14px;border-radius:8px;z-index:99;display:none;font-size:13px;max-width:60vw;white-space:pre-wrap}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#3a4150;border-radius:4px}
.candMark{cursor:pointer}
.candMark circle{animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.standHot{cursor:pointer}
</style>
</head>
<body>
<div id="errbox"></div>
<header>
  <h1>送机模拟器 <span>· 浦东机场 T2（7/8号机坪） <b style="color:#49b981">V2</b></span></h1>
  <div class="tabs">
    <div class="tab active" id="tabPractice">练习模式</div>
    <div class="tab" id="tabQuiz">考核模式</div>
  </div>
  <div id="quizBar"><span>进度 <span class="prog" id="quizProg">0/10</span></span><span>得分 <span class="prog" id="quizScore">0</span></span></div>
  <div class="hdr-right">
    <button class="btn" id="btnScores">成绩记录</button>
    <button class="btn" id="btnReset">复位场景</button>
  </div>
</header>
<main>
  <div id="mapWrap">
    <svg id="map" viewBox="0 0 1720 780" preserveAspectRatio="xMidYMid meet"><g id="viewport"></g></svg>
    <div id="caption"></div>
    <div id="mapToolbar">
      <button class="btn" id="zoomIn" title="放大">＋</button>
      <button class="btn" id="zoomOut" title="缩小">－</button>
      <button class="btn" id="zoomReset" title="复位">⤾</button>
    </div>
    <div id="legend">
      <div><span class="sw" style="background:#d8b93a"></span>滑行道/滑行线　<span class="sw" style="background:#c0392b"></span>机位安全线</div>
      <div><span class="sw" style="background:var(--route)"></span>推出路线　<span class="sw" style="background:var(--tow)"></span>二次牵引路线</div>
      <div style="margin-top:4px;color:#6b7485">示意图为简化重绘，仅供内部培训使用</div>
    </div>
  </div>
  <div id="side">
    <div class="card" id="standCard">
      <h3>① 选择机位</h3>
      <div id="standInfo" class="dim">请在地图上点击一个机位（飞机图标处），或从下拉框选择。</div>
      <select id="standSel" style="width:100%;margin-top:8px;padding:8px;border-radius:6px;background:#1e222a;color:var(--txt);border:1px solid var(--line)"></select>
    </div>
    <div class="card" id="instrCard">
      <h3>② 机长指令</h3>
      <div id="quizInstr" class="ruletxt" style="display:none"></div>
      <div id="practiceInstr">
        <input id="instrInput" placeholder='例如：可以推，头朝南　/　可以推出开车　/　可以推，头朝南，让出E6道口'>
        <button class="btn primary" id="btnParse" style="margin-top:8px;width:100%" disabled>解析指令</button>
      </div>
      <div id="parseOut"></div>
    </div>
    <div class="card" id="answerCard" style="display:none">
      <h3>③ 学员作答</h3>
      <div class="stepHint">第1步：选择<b>机头朝向</b></div>
      <div class="dirBtns">
        <div class="dirBtn" data-dir="N">← 北</div>
        <div class="dirBtn" data-dir="E">↑ 东</div>
        <div class="dirBtn" data-dir="S">→ 南</div>
        <div class="dirBtn" data-dir="W">↓ 西</div>
      </div>
      <div class="stepHint" style="margin-top:10px">第2步：在地图上点击选择<b>推出结束位置</b>（黄色闪烁圆点）</div>
      <div class="stepHint" style="margin-top:4px">第3步：选择<b>二次牵引方式</b></div>
      <div class="mvOpts">
        <div class="mvOpt" data-mv="none">不需要二次牵引，推到位即停</div>
        <div class="mvOpt" data-mv="pull">先推后拉（推出后再向前牵引）</div>
        <div class="mvOpt" data-mv="push">先推再推（推出后继续再推一段）</div>
      </div>
      <button class="btn primary" id="btnSubmit" style="margin-top:10px;width:100%">提交答案</button>
    </div>
    <div class="card" id="fbCard" style="display:none">
      <h3>评判结果</h3>
      <div id="feedback"></div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn ok" id="btnDemo" style="flex:1">▶ 播放正确演示</button>
        <button class="btn primary" id="btnNext" style="flex:1;display:none">下一题 →</button>
      </div>
    </div>
  </div>
</main>
<div class="modalMask" id="scoreModal"><div class="modal">
  <h2>考核成绩记录</h2>
  <div id="scoreList"></div>
  <div style="text-align:right;margin-top:12px"><button class="btn" id="btnClearScores">清空记录</button> <button class="btn primary" id="btnCloseScores">关闭</button></div>
</div></div>
<script>
window.onerror=function(m,s,l,c){var e=document.getElementById('errbox');e.style.display='block';e.textContent='脚本错误: '+m+' (行'+l+':'+c+')';};
'use strict';
/* ================= 基础常量 ================= */
/* 屏幕方向约定：北=左（与ZSPD官方航图一致） 东=上 南=右 西=下 */
const DIR2HDG={N:270,E:0,S:90,W:180};
const CN2DIR={'北':'N','东':'E','南':'S','西':'W'};
const DIR_CN={N:'北',E:'东',S:'南',W:'西'};
const MV_CN={none:'不需要二次牵引',pull:'先推后拉',push:'先推再推'};
const AREA_INFO={
 A:{name:'A区',rule:'机头朝北，推出至 L12。滑出主用 L12/L10/E6；滑入主用 E7/L11/L12。'},
 B:{name:'B区',rule:'机头朝东。50/51/53 滑出主用 L10/E6，滑入 E7/L10；801-805 滑出主用 L11/E6，滑入 E7/L11。'},
 C:{name:'C区',rule:'机头朝南，推出至 L08。滑入主用 R6/L08。'},
 D:{name:'D区',rule:'机头朝北，推出至 L08。滑入主用 R5/L08。'},
 E:{name:'E区',rule:'机头朝南，推出至 L08。滑入主用 R5/L08。'},
 F:{name:'F区',rule:'机头朝东，推出至 L07。滑入主用 W7/L07。W5 为进港滑行道，W4 为出港滑行道。'},
 G:{name:'G区',rule:'机头朝南，推出至 L06。滑入主用 W5/L06。'}
};
/* ================= 机位数据（V2：布局严格参照 T2.png，坐标可按需微调） ================= */
const STANDS={};
function reg(id,cfg){STANDS[id]=Object.assign({kind:'桥位',towType:null,towEnd:null,towKeyword:'',towDesc:'',angled:false,angledHdg:0,curve:1,special:'',distractors:[]},cfg);}
/* C区 55-65（指廊北排，推出至L08，默认机头朝南；55/57斜停） */
[55,57,59,61,63,65].forEach((n,i)=>{const x=263+i*60;reg(n,{area:'C',x:x,y:390,parkedHdg:180,defaultDir:'S',pushEnd:{x:x,y:333},pushDesc:'L08 滑行线',distractors:[{x:x,y:228},{x:x,y:633}]});});
STANDS[55].parkedHdg=200;STANDS[57].parkedHdg=190;
/* D区 67-75（机头朝北） */
[67,69,71,73,75].forEach((n,i)=>{const x=623+i*60;reg(n,{area:'D',x:x,y:390,parkedHdg:180,defaultDir:'N',pushEnd:{x:x,y:333},pushDesc:'L08 滑行线',distractors:[{x:x,y:228},{x:x,y:633}]});});
/* E区 77-93（机头朝南；93斜停） */
[77,79,81,83,85,87,89,91,93].forEach((n,i)=>{const x=923+i*60;reg(n,{area:'E',x:x,y:390,parkedHdg:180,defaultDir:'S',pushEnd:{x:x,y:333},pushDesc:'L08 滑行线',distractors:[{x:x,y:228},{x:x,y:633}]});});
STANDS[93].parkedHdg=150;
/* A区 52-64偶（西指廊南排，推出至L12，机头朝北；50/52斜停） */
[52,54,56,58,60,62,64].forEach((n,i)=>{const x=313+i*50;reg(n,{area:'A',x:x,y:565,parkedHdg:0,defaultDir:'N',pushEnd:{x:x,y:633},pushDesc:'L12 滑行线',distractors:[{x:x,y:333},{x:200,y:690}]});});
STANDS[52].parkedHdg=15;
/* B区 50/51/53（斜停，机头朝东） */
reg(50,{area:'B',x:263,y:565,parkedHdg:35,defaultDir:'E',pushEnd:{x:225,y:633},pushDesc:'L12/L10 一带',curve:-1,distractors:[{x:263,y:333},{x:400,y:633}]});
reg(51,{area:'B',x:263,y:490,parkedHdg:115,defaultDir:'E',pushEnd:{x:205,y:545},pushDesc:'L10/L11 一带',curve:-1,distractors:[{x:263,y:333},{x:400,y:633}]});
reg(53,{area:'B',x:263,y:453,parkedHdg:105,defaultDir:'E',pushEnd:{x:215,y:520},pushDesc:'L10/L11 一带',curve:-1,distractors:[{x:263,y:333},{x:400,y:633}]});
/* G区 80-94偶（南指廊南排，推出至L06，机头朝南；92/94斜停） */
[80,82,84,86,88,90,92,94].forEach((n,i)=>{const x=1133+i*44;reg(n,{area:'G',x:x,y:565,parkedHdg:0,defaultDir:'S',pushEnd:{x:x,y:633},pushDesc:'L06 滑行线',distractors:[{x:x,y:333},{x:1538,y:633}]});});
STANDS[92].parkedHdg=350;STANDS[94].parkedHdg=325;
/* F区 95-98（95斜停在北排东端；97/98竖排；96斜停） */
reg(95,{area:'F',x:1463,y:390,parkedHdg:140,defaultDir:'E',pushEnd:{x:1538,y:390},pushDesc:'L07 滑行线',distractors:[{x:1400,y:633},{x:1538,y:633}]});
reg(97,{area:'F',x:1478,y:468,parkedHdg:270,defaultDir:'E',pushEnd:{x:1538,y:468},pushDesc:'L07 滑行线',distractors:[{x:1400,y:633},{x:1538,y:633}]});
reg(98,{area:'F',x:1478,y:508,parkedHdg:270,defaultDir:'E',pushEnd:{x:1538,y:508},pushDesc:'L07 滑行线',distractors:[{x:1400,y:633},{x:1538,y:633}]});
reg(96,{area:'F',x:1478,y:558,parkedHdg:300,defaultDir:'E',pushEnd:{x:1470,y:633},pushDesc:'L06 滑行线（长推）',curve:-1,distractors:[{x:1400,y:633},{x:1538,y:408}]});
/* 远机位 801-805（L10/L11 西侧，机头朝东） */
[[805,363],[804,415],[803,460],[802,520],[801,580]].forEach(a=>{reg(a[0],{area:'B',kind:'远机位',x:60,y:a[1],parkedHdg:90,defaultDir:'E',pushEnd:{x:152,y:a[1]},pushDesc:'L11 滑行线',curve:-1,distractors:[{x:200,y:690},{x:263,y:333}]});});
/* 远机位 806-809（8号坪西，机头朝南） */
[806,807,808,809].forEach((n,i)=>{const x=270+i*48;reg(n,{area:'C',kind:'远机位',x:x,y:250,parkedHdg:0,defaultDir:'S',pushEnd:{x:x,y:333},pushDesc:'L08 滑行线',distractors:[{x:x,y:228},{x:x,y:633}]});});
/* 远机位 810-816（8号坪东，机头朝南） */
[810,811,812,813,814,815,816].forEach((n,i)=>{const x=1050+i*50;reg(n,{area:'E',kind:'远机位',x:x,y:250,parkedHdg:0,defaultDir:'S',pushEnd:{x:x,y:333},pushDesc:'L08 滑行线',distractors:[{x:x,y:228},{x:1200,y:633}]});});
/* ===== 特殊机位程序 ===== */
Object.assign(STANDS[55],{pushEnd:{x:250,y:333},towType:'pull',towEnd:{x:310,y:343},towKeyword:'让出E6道口',towDesc:'L08，让出E6道口（机尾过E6以南中间等待位置）',special:'先推后拉，让出E6道口'});
Object.assign(STANDS[806],{towType:'pull',towEnd:{x:310,y:343},towKeyword:'让出E6道口',towDesc:'L08，让出E6道口（机尾过E6以南中间等待位置）',special:'先推后拉，让出E6道口'});
Object.assign(STANDS[67],{towType:'push',towEnd:{x:480,y:330},towKeyword:'让出R6道口',towDesc:'L08，让出R6道口',special:'先推再推，让出R6道口'});
Object.assign(STANDS[75],{pushEnd:{x:1073,y:333},towType:'pull',towEnd:{x:990,y:328},towKeyword:'让出R5道口',towDesc:'L08，机尾过R5北侧中间等待位置',special:'先推后拉，让出R5道口'});
[77,79].forEach(n=>Object.assign(STANDS[n],{pushEnd:{x:1073,y:333},towType:'pull',towEnd:{x:1150,y:338},towKeyword:'让出R5道口',towDesc:'L08，让出R5道口（机尾过R5以南中间等待位置）',special:'先推后拉，让出R5道口'}));
Object.assign(STANDS[810],{pushEnd:{x:1073,y:333},towType:'pull',towEnd:{x:1150,y:338},towKeyword:'让出R5道口',towDesc:'L08，让出R5道口（机尾过R5以南中间等待位置）',special:'先推后拉，让出R5道口'});
Object.assign(STANDS[96],{towType:'pull',towEnd:{x:1538,y:530},towKeyword:'拉到L07指定位置',towDesc:'L07 指定位置（CE05，不影响W5滑行道）',special:'长推至L06后向前拉至L07指定位置（先推后拉），不影响W5'});
[92,94].forEach(n=>Object.assign(STANDS[n],{towType:'push',towEnd:{x:1280,y:633},towKeyword:'推到90号位以北',towDesc:'L06，90号位以北指定位置（CE06）',special:'长推至90号位以北L06指定位置（先推再推）'}));
Object.assign(STANDS[64],{angled:true,angledHdg:315,pushEnd:{x:600,y:612},pushDesc:'推出线1号位（鼻轮不得推过推出等待点）',special:'沿推出线推至1号位，鼻轮不得推过推出等待点',distractors:[{x:613,y:633},{x:613,y:333}]});
Object.assign(STANDS[80],{angled:true,angledHdg:60,pushEnd:{x:1120,y:612},pushDesc:'推出线1号位（鼻轮不得推过推出等待点）',special:'沿推出线推至1号位，鼻轮不得推过推出等待点',distractors:[{x:1133,y:633},{x:1133,y:333}]});
Object.assign(STANDS[801],{angled:true,angledHdg:25,special:'推到位后飞机呈斜停状态'});
/* ================= 地图绘制 ================= */
const NS='http://www.w3.org/2000/svg';
const viewport=document.getElementById('viewport');
function el(name,attrs,parent){const e=document.createElementNS(NS,name);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function taxiRibbon(g,d,label,lx,ly,vertical){el('path',{d:d,stroke:'#434a55','stroke-width':15,fill:'none','stroke-linecap':'round'},g);el('path',{d:d,stroke:'#d8b93a','stroke-width':1.6,'stroke-dasharray':'10 8',fill:'none'},g);if(label){const t=el('text',{x:lx,y:ly,fill:'#e6c85a','font-size':14,'font-weight':'bold','text-anchor':'middle'},g);t.textContent=label;}}

/* ================= 指令解析 ================= */
function parseInstr(t){
  const res={dir:null,towReq:false,notes:[]};
  let m=t.match(/头\s*[朝向]\s*([南北东西])/);if(!m)m=t.match(/朝\s*([南北东西])/);
  if(m)res.dir=CN2DIR[m[1]];
  if(/绿程序/.test(t))res.notes.push('识别到"绿程序"：绿/蓝程序为卫星厅规则，T2 不适用，按 T2 规则处理');
  if(/蓝程序/.test(t))res.notes.push('识别到"蓝程序"：绿/蓝程序为卫星厅规则，T2 不适用，按 T2 规则处理');
  if(/让出|道口|拖到|拖至|牵引|指定位置|推到\s*\d|以北|以南|以东|以西/.test(t))res.towReq=true;
  return res;
}
function restate(p){
  let h='';
  h+='<div><span class="tag">理解</span>'+(p.dir?'指令明确：<b style="color:#9ecbff">机头朝'+DIR_CN[p.dir]+'</b>':'指令未明确机头朝向 → <b style="color:#9ecbff">按该机位默认规则执行</b>')+'</div>';
  h+='<div><span class="tag">程序</span>'+(p.towReq?'指令要求<b style="color:#9ecbff">推/拖至指定位置</b>':(p.dir?'指令仅给出机头朝向 → <b style="color:#9ecbff">按方向推至滑行线即可停止</b>':'按默认推出程序执行'))+'</div>';
  p.notes.forEach(n=>h+='<div style="color:#e08b3a">'+n+'</div>');
  $('parseOut').innerHTML=h;
}
/* ================= 正确答案计算 ================= */
function computeCorrect(st,p){
  const dir=p.dir||st.defaultDir;
  const tow=p.dir?(p.towReq?st.towType:null):st.towType;
  const endpoint=tow?st.towEnd:st.pushEnd;
  const endDesc=tow?st.towDesc:st.pushDesc;
  const hdg=(st.angled&&dir===st.defaultDir&&!p.dir)?st.angledHdg:DIR2HDG[dir];
  return{dir:dir,maneuver:tow||'none',endpoint:endpoint,endDesc:endDesc,hdg:hdg};
}
function startAnswerPhase(){
  const st=STANDS[S.standId];
  S.correct=computeCorrect(st,S.parsed);
  restate(S.parsed);
  $('answerCard').style.display='block';
  spawnCandidates(st,S.correct);
}

function clearCand(){window._layerCand.innerHTML='';}
function spawnCandidates(st,correct){
  clearCand();
  const pts=[{x:correct.endpoint.x,y:correct.endpoint.y}];
  const other=(correct.endpoint===st.pushEnd)?st.towEnd:st.pushEnd;
  if(other&&dist(other,correct.endpoint)>30)pts.push({x:other.x,y:other.y});
  st.distractors.forEach(d=>{if(pts.length<4&&pts.every(p=>dist(p,d)>40))pts.push({x:d.x,y:d.y});});
  for(let i=pts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=pts[i];pts[i]=pts[j];pts[j]=t;}
  pts.forEach(p=>{
    const g=el('g',{class:'candMark',transform:'translate('+p.x+','+p.y+')'},window._layerCand);
    el('circle',{cx:0,cy:0,r:13,fill:'rgba(240,180,41,.22)',stroke:'#f0b429','stroke-width':2,'stroke-dasharray':'4 3'},g);
    el('circle',{cx:0,cy:0,r:4.5,fill:'#f0b429'},g);
    g.addEventListener('click',ev=>{
      ev.stopPropagation();if(S.anim)return;
      S.ans.pt={x:p.x,y:p.y};

      g.querySelector('circle').setAttribute('fill','rgba(240,180,41,.85)');
    });
  });
}

  const len=path.getTotalLength();const t0=performance.now();
  function frame(now){
    const t=Math.min(1,(now-t0)/dur);
    const e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
    const p=path.getPointAtLength(len*e);
    const h=lerpAngle(h0,h1,smooth(.25,1,e));
    plane.setAttribute('transform','translate('+p.x+','+p.y+') rotate('+h+')');
    const rad=h*Math.PI/180;const nx=Math.sin(rad),ny=-Math.cos(rad);
    tug.setAttribute('transform','translate('+(p.x+nx*42)+','+(p.y+ny*42)+') rotate('+h+')');
    if(t<1)requestAnimationFrame(frame);else if(cb)cb();
  }
  requestAnimationFrame(frame);
}
$('btnDemo').onclick=()=>{if(!S.anim&&S.correct)playDemo();};
$('btnReset').onclick=()=>{if(S.anim)return;clearFx();caption('');if(S.standId)selectStand(S.standId);};
/* ================= 考核模式 ================= */
function otherDir(d){const pool=['N','E','S','W'].filter(x=>x!==d);return pool[Math.floor(Math.random()*pool.length)];}
function genInstr(st){
  const r=Math.random();
  if(st.towType&&r<0.4){
    const d=Math.random()<0.65?st.defaultDir:otherDir(st.defaultDir);
    return '可以推，头朝'+DIR_CN[d]+'，'+st.towKeyword+'。';
  }
  if(r<0.8){
    const d=Math.random()<0.6?st.defaultDir:otherDir(st.defaultDir);
    return '可以推，头朝'+DIR_CN[d]+'。';
  }
  return '可以推出开车。';
}
function startQuiz(){
  const ids=Object.keys(STANDS);
  S.quiz={list:[],idx:0,score:0,wrong:0,results:[]};
  for(let i=0;i<10;i++){const id=ids[Math.floor(Math.random()*ids.length)];S.quiz.list.push({id:id,instr:genInstr(STANDS[id])});}
  $('quizBar').style.display='flex';showQuizQ();
}
function showQuizQ(){
  const q=S.quiz.list[S.quiz.idx];
  $('quizProg').textContent=(S.quiz.idx+1)+'/'+S.quiz.list.length;
  selectStand(q.id);
  $('quizInstr').style.display='block';
  $('quizInstr').textContent='📻 机长指令：「'+q.instr+'」';
  S.parsed=parseInstr(q.instr);
  $('answerCard').style.display='block';
  startAnswerPhase();
}
$('btnNext').onclick=()=>{
  if(S.anim)return;
  S.quiz.idx++;
  if(S.quiz.idx>=S.quiz.list.length){finishQuiz();return;}
  showQuizQ();
};
function finishQuiz(){
  const total=S.quiz.list.length,score=S.quiz.score;
  saveScore(score,total);
  let h='<div class="ansline" style="font-size:16px">本次考核结束：<b style="color:#f0b429">'+score+' / '+total+'</b> 题完全正确</div>';
  S.quiz.results.forEach((r,i)=>{
    h+='<div class="ansline">'+(r.ok?'<span class="good">✓</span>':'<span class="bad">✗</span>')+' 第'+(i+1)+'题 · '+r.stand+'号位 · 「'+r.instr+'」'+(r.ok?'':'<br><span class="dim">'+(r.dirOK?'':'朝向错 ')+(r.ptOK?'':'终点错 ')+(r.mvOK?'':'牵引错')+'</span>')+'</div>';
  });
  $('feedback').innerHTML=h;$('fbCard').style.display='block';$('btnNext').style.display='none';
  $('quizProg').textContent='已结束';
  caption('考核结束：'+score+'/'+total,'#49b981');
}
/* ================= 成绩记录 ================= */
function saveScore(s,t){
  try{
    const arr=JSON.parse(localStorage.getItem('songji_scores')||'[]');
    arr.unshift({time:new Date().toLocaleString('zh-CN'),score:s,total:t});
    localStorage.setItem('songji_scores',JSON.stringify(arr.slice(0,50)));
  }catch(e){}
}
function showScores(){
  let arr=[];try{arr=JSON.parse(localStorage.getItem('songji_scores')||'[]');}catch(e){}
  $('scoreList').innerHTML=arr.length?arr.map(r=>'<div class="hrow"><span>'+r.time+'</span><b style="color:#f0b429">'+r.score+' / '+r.total+'</b></div>').join(''):'<div class="dim">暂无考核记录</div>';
  $('scoreModal').style.display='flex';
}
$('btnScores').onclick=showScores;
$('btnCloseScores').onclick=()=>$('scoreModal').style.display='none';
$('btnClearScores').onclick=()=>{localStorage.removeItem('songji_scores');showScores();};
$('scoreModal').addEventListener('click',ev=>{if(ev.target.id==='scoreModal')$('scoreModal').style.display='none';});
/* ================= 模式切换 ================= */
function setMode(m){
  S.mode=m;
  $('tabPractice').classList.toggle('active',m==='practice');
  $('tabQuiz').classList.toggle('active',m==='quiz');
  clearFx();clearCand();clearAnswerUI();$('feedback').innerHTML='';$('fbCard').style.display='none';
  if(m==='practice'){
    $('quizBar').style.display='none';$('quizInstr').style.display='none';$('practiceInstr').style.display='block';
    caption('');if(S.standId)selectStand(S.standId);
  }else{
    $('practiceInstr').style.display='none';$('parseOut').innerHTML='';
    startQuiz();
  }
}
$('tabPractice').onclick=()=>{if(!S.anim)setMode('practice');};
$('tabQuiz').onclick=()=>{if(!S.anim)setMode('quiz');};
/* ================= 初始化 ================= */
buildMap();
caption('请点击地图上的机位开始练习','var(--info)');
setTimeout(()=>{if(!S.standId)caption('');},5000);
</script>
